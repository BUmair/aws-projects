<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Static site on private S3 with CloudFront and OAC</title>
  <desc>1. A browser requests the site from CloudFront. 2. CloudFront signs the request with Origin Access Control and fetches the file from the private S3 bucket. 3. A direct request to the S3 URL is denied.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowDenied" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Opaque background so the diagram reads the same in light and dark mode -->
  <rect x="0" y="0" width="900" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>

  <!-- Browser -->
  <rect x="30" y="90" width="200" height="100" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="130" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Browser</text>
  <text x="130" y="154" text-anchor="middle" font-size="14" fill="#374151">visitor or curl</text>

  <!-- CloudFront -->
  <rect x="350" y="90" width="200" height="100" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="450" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">CloudFront</text>
  <text x="450" y="154" text-anchor="middle" font-size="14" fill="#374151">HTTPS, signs with OAC</text>

  <!-- S3 bucket -->
  <rect x="660" y="90" width="210" height="100" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="765" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">S3 bucket</text>
  <text x="765" y="154" text-anchor="middle" font-size="14" fill="#374151">private, index.html</text>

  <!-- 1. Request: Browser to CloudFront -->
  <line x1="230" y1="130" x2="348" y2="130" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="289" cy="104" r="14" fill="#1f2937"/>
  <text x="289" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>

  <!-- 2. Fetch: CloudFront to S3 -->
  <line x1="552" y1="130" x2="658" y2="130" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="605" cy="104" r="14" fill="#1f2937"/>
  <text x="605" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>

  <!-- 3. Denied: direct request to S3 -->
  <path d="M 765 90 L 765 40 L 130 40 L 130 88" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowDenied)"/>
  <circle cx="450" cy="40" r="14" fill="#b91c1c"/>
  <text x="450" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="450" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Direct S3 URL: AccessDenied</text>

  <!-- Legend -->
  <line x1="30" y1="236" x2="70" y2="236" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="80" y="241" font-size="14" fill="#111827">allowed request</text>
  <line x1="30" y1="262" x2="70" y2="262" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowDenied)"/>
  <text x="80" y="267" font-size="14" fill="#111827">blocked request</text>

  <text x="330" y="236" font-size="14" fill="#374151">Block Public Access on. Only CloudFront can read the bucket.</text>
  <text x="330" y="258" font-size="14" fill="#374151">Bucket policy scoped to this distribution's ARN.</text>
</svg>
