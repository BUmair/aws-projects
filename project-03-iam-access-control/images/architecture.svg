<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>IAM access control by tag</title>
  <desc>A developer user belongs to a group with the dev-environment policy attached. 1: the group policy allows EC2 actions on instances tagged Env=development, so the development instance is reachable. 2: the production instance tagged Env=production does not match the condition, so the same actions are denied.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowDenied" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Opaque background so the diagram reads the same in light and dark mode -->
  <rect x="0" y="0" width="900" height="420" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>

  <!-- Developer -->
  <rect x="30" y="165" width="180" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="120" y="201" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Developer</text>
  <text x="120" y="227" text-anchor="middle" font-size="14" fill="#374151">dev-user</text>

  <!-- Group with policy -->
  <rect x="300" y="150" width="230" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="415" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">dev-group</text>
  <text x="415" y="212" text-anchor="middle" font-size="14" fill="#374151">dev-environment policy</text>
  <text x="415" y="234" text-anchor="middle" font-size="14" fill="#374151">attached to the group</text>

  <!-- Development instance (allowed) -->
  <rect x="640" y="40" width="230" height="90" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="755" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Dev instance</text>
  <text x="755" y="102" text-anchor="middle" font-size="14" fill="#374151">Env=development</text>

  <!-- Production instance (denied) -->
  <rect x="640" y="290" width="230" height="90" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="755" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Prod instance</text>
  <text x="755" y="352" text-anchor="middle" font-size="14" fill="#374151">Env=production</text>

  <!-- Arrows -->
  <line x1="212" y1="210" x2="296" y2="210" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="532" y1="190" x2="636" y2="95" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="532" y1="230" x2="636" y2="325" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowDenied)"/>

  <!-- Step labels -->
  <circle cx="254" cy="190" r="13" fill="#1f2937"/>
  <text x="254" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="590" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">allowed</text>
  <circle cx="586" cy="291" r="13" fill="#1f2937"/>
  <text x="586" y="297" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="590" y="352" text-anchor="middle" font-size="14" font-weight="600" fill="#c2410c">denied</text>
</svg>
