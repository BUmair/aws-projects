<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="sls-title sls-desc">
  <rect width="720" height="400" rx="12" fill="#0a0a0a"/>
          <title id="sls-title">File-processing flow</title>
          <desc id="sls-desc">A file is uploaded to the input bucket. S3 sends an event to one of three functions, based on the file type and folder. The function saves its result to the output bucket.</desc>
          <defs><marker id="arw2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker></defs>

          <rect x="20" y="150" width="150" height="100" rx="14" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
          <text x="95" y="190" fill="#fff" font-size="20" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">Upload</text>
          <text x="95" y="218" fill="#fff" font-size="15" text-anchor="middle" font-family="Geist, sans-serif">a file</text>

          <line x1="172" y1="200" x2="210" y2="200" stroke="#fff" stroke-width="2" marker-end="url(#arw2)"/>
          <rect x="212" y="150" width="158" height="100" rx="14" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
          <text x="291" y="190" fill="#fff" font-size="18" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">Input bucket</text>
          <text x="291" y="214" fill="#fff" font-size="14" text-anchor="middle" font-family="Geist, sans-serif">uploads/ folder</text><text x="291" y="234" fill="#fff" font-size="14" text-anchor="middle" font-family="Geist, sans-serif">incoming/ folder</text>

          <line x1="372" y1="180" x2="428" y2="75" stroke="#fff" stroke-width="2" marker-end="url(#arw2)"/>
          <line x1="372" y1="200" x2="428" y2="195" stroke="#fff" stroke-width="2" marker-end="url(#arw2)"/>
          <line x1="372" y1="220" x2="428" y2="315" stroke="#fff" stroke-width="2" marker-end="url(#arw2)"/>

          <rect x="430" y="40" width="270" height="70" rx="12" fill="#fff"/>
          <text x="565" y="72" fill="#000" font-size="18" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">csv-processor</text>
          <text x="565" y="96" fill="#000" font-size="14" text-anchor="middle" font-family="Geist, sans-serif">.csv files in uploads/</text>

          <rect x="430" y="160" width="270" height="70" rx="12" fill="#fff"/>
          <text x="565" y="192" fill="#000" font-size="18" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">json-processor</text>
          <text x="565" y="216" fill="#000" font-size="14" text-anchor="middle" font-family="Geist, sans-serif">.json files in uploads/</text>

          <rect x="430" y="280" width="270" height="70" rx="12" fill="#fff"/>
          <text x="565" y="312" fill="#000" font-size="18" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">image-processor</text>
          <text x="565" y="336" fill="#000" font-size="14" text-anchor="middle" font-family="Geist, sans-serif">.png files in incoming/</text>

          <line x1="545" y1="350" x2="545" y2="372" stroke="#fff" stroke-width="2"/>
          <line x1="545" y1="372" x2="236" y2="372" stroke="#fff" stroke-width="2" marker-end="url(#arw2)"/>
          <rect x="20" y="292" width="200" height="100" rx="14" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
          <text x="120" y="332" fill="#fff" font-size="18" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">Output bucket</text>
          <text x="120" y="358" fill="#fff" font-size="14" text-anchor="middle" font-family="Geist, sans-serif">processed/ folder</text>

          <circle cx="182" cy="176" r="14" fill="#fff"/>
          <text x="182" y="182" fill="#000" font-size="16" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">1</text>
          <circle cx="398" cy="118" r="14" fill="#fff"/>
          <text x="398" y="124" fill="#000" font-size="16" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">2</text>
          <circle cx="400" cy="372" r="14" fill="#fff"/>
          <text x="400" y="378" fill="#000" font-size="16" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">3</text>
        </svg>
