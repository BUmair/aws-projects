<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Serverless REST API: request flow</title>
  <desc>Numbered flow. 1: the client signs in to Cognito and gets a token. 2: the client sends the request to API Gateway, which checks the token. 3: API Gateway invokes Lambda. 4: Lambda reads and writes DynamoDB. 5: Lambda writes a log line to CloudWatch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Opaque background so the diagram reads the same in light and dark mode -->
  <rect x="0" y="0" width="900" height="420" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>

  <!-- Boxes -->
  <rect x="30" y="150" width="180" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="120" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Client</text>
  <text x="120" y="212" text-anchor="middle" font-size="14" fill="#374151">browser or curl</text>

  <rect x="340" y="30" width="220" height="90" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="2.5"/>
  <text x="450" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Cognito</text>
  <text x="450" y="92" text-anchor="middle" font-size="14" fill="#374151">user pool: issues tokens</text>

  <rect x="340" y="150" width="220" height="90" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="450" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">API Gateway</text>
  <text x="450" y="212" text-anchor="middle" font-size="14" fill="#374151">HTTP API + JWT check</text>

  <rect x="650" y="150" width="200" height="90" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="750" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Lambda</text>
  <text x="750" y="212" text-anchor="middle" font-size="14" fill="#374151">items-api (Python)</text>

  <rect x="650" y="290" width="200" height="90" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="750" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">DynamoDB</text>
  <text x="750" y="352" text-anchor="middle" font-size="14" fill="#374151">table: items</text>

  <rect x="650" y="30" width="200" height="90" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="750" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">CloudWatch Logs</text>
  <text x="750" y="92" text-anchor="middle" font-size="14" fill="#374151">one line per request</text>

  <!-- 1. Sign in: Client to Cognito -->
  <path d="M 120 150 L 120 75 L 338 75" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="200" cy="75" r="14" fill="#1f2937"/>
  <text x="200" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>

  <!-- 2. Request: Client to API Gateway -->
  <line x1="210" y1="195" x2="338" y2="195" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="274" cy="165" r="14" fill="#1f2937"/>
  <text x="274" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>

  <!-- JWT check: API Gateway to Cognito (dashed) -->
  <line x1="450" y1="150" x2="450" y2="122" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowDashed)"/>
  <text x="462" y="140" font-size="14" fill="#374151">verifies token</text>

  <!-- 3. Invoke: API Gateway to Lambda -->
  <line x1="562" y1="195" x2="648" y2="195" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="605" cy="165" r="14" fill="#1f2937"/>
  <text x="605" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>

  <!-- 4. Read/write: Lambda to DynamoDB -->
  <line x1="750" y1="242" x2="750" y2="288" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="790" cy="265" r="14" fill="#1f2937"/>
  <text x="790" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>

  <!-- 5. Log: Lambda to CloudWatch (dashed) -->
  <line x1="750" y1="148" x2="750" y2="122" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowDashed)"/>
  <circle cx="790" cy="135" r="14" fill="#4b5563"/>
  <text x="790" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>

  <!-- Legend and routes -->
  <line x1="30" y1="330" x2="70" y2="330" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="80" y="335" font-size="14" fill="#111827">request flow</text>
  <line x1="30" y1="360" x2="70" y2="360" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowDashed)"/>
  <text x="80" y="365" font-size="14" fill="#111827">check or log</text>

  <text x="30" y="396" font-size="14" font-weight="700" fill="#111827">Public routes:</text>
  <text x="150" y="396" font-size="14" fill="#1f2937">GET /items, GET /items/{id}</text>
  <text x="30" y="416" font-size="14" font-weight="700" fill="#111827">Need a token:</text>
  <text x="150" y="416" font-size="14" fill="#1f2937">POST /items, DELETE /items/{id}</text>
</svg>
