<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Serverless REST API architecture</title>
  <desc>A client calls API Gateway. A JWT authorizer checks tokens issued by Cognito. API Gateway invokes a Lambda function, which reads and writes a DynamoDB table and sends logs to CloudWatch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="20" y="150" width="130" height="70" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="85" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Client</text>
  <text x="85" y="200" text-anchor="middle" font-size="12" fill="#4b5563">browser / curl</text>

  <!-- Cognito -->
  <rect x="20" y="20" width="200" height="70" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="120" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Cognito user pool</text>
  <text x="120" y="72" text-anchor="middle" font-size="12" fill="#4b5563">issues ID tokens</text>

  <!-- API Gateway -->
  <rect x="260" y="150" width="190" height="70" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="355" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">API Gateway</text>
  <text x="355" y="198" text-anchor="middle" font-size="12" fill="#4b5563">HTTP API + JWT authorizer</text>

  <!-- Lambda -->
  <rect x="510" y="150" width="150" height="70" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="585" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Lambda</text>
  <text x="585" y="200" text-anchor="middle" font-size="12" fill="#4b5563">items-api (Python)</text>

  <!-- DynamoDB -->
  <rect x="740" y="150" width="140" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="810" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">DynamoDB</text>
  <text x="810" y="200" text-anchor="middle" font-size="12" fill="#4b5563">table: items</text>

  <!-- CloudWatch Logs -->
  <rect x="510" y="290" width="150" height="60" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="585" y="316" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">CloudWatch Logs</text>
  <text x="585" y="334" text-anchor="middle" font-size="12" fill="#4b5563">one entry per request</text>

  <!-- Flows -->
  <!-- Client to API Gateway: HTTPS requests -->
  <line x1="150" y1="185" x2="258" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="204" y="176" text-anchor="middle" font-size="12" fill="#4b5563">HTTPS</text>

  <!-- Client to Cognito: sign in, get token -->
  <path d="M 85 150 L 85 90" fill="none" stroke="#be185d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="95" y="128" font-size="12" fill="#4b5563">1. sign in, get token</text>

  <!-- Client sends token to API Gateway -->
  <path d="M 150 60 L 300 60 L 300 150" fill="none" stroke="#be185d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="225" y="52" text-anchor="middle" font-size="12" fill="#4b5563">2. Bearer token on POST / DELETE</text>

  <!-- API Gateway to Lambda -->
  <line x1="450" y1="185" x2="508" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="479" y="176" text-anchor="middle" font-size="12" fill="#4b5563">invoke</text>

  <!-- Lambda to DynamoDB -->
  <line x1="660" y1="185" x2="738" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="699" y="176" text-anchor="middle" font-size="12" fill="#4b5563">read / write</text>

  <!-- Lambda to CloudWatch -->
  <line x1="585" y1="220" x2="585" y2="288" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Routes legend -->
  <rect x="260" y="270" width="200" height="80" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="272" y="292" font-size="12" font-weight="600" fill="#111827">Routes</text>
  <text x="272" y="312" font-size="12" fill="#374151">GET /items        public</text>
  <text x="272" y="328" font-size="12" fill="#374151">GET /items/{id}   public</text>
  <text x="272" y="344" font-size="12" fill="#374151">POST /items       JWT</text>
  <text x="272" y="360" font-size="12" fill="#374151">DELETE /items/{id} JWT</text>
</svg>
