<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="arch-title arch-desc">
  <rect width="720" height="400" rx="12" fill="#0a0a0a"/>
          <title id="arch-title">Infrastructure overview</title>
          <desc id="arch-desc">Visitors reach two web servers through an internet gateway. Each server sits in its own public subnet inside the VPC. Visitors also reach a separate S3 bucket that hosts the website.</desc>
          <defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fff"/></marker></defs>

          <rect x="20" y="130" width="140" height="100" rx="14" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
          <text x="90" y="170" fill="#fff" font-size="20" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">Visitors</text>
          <text x="90" y="198" fill="#fff" font-size="15" text-anchor="middle" font-family="Geist, sans-serif">use a browser</text>

          <line x1="160" y1="180" x2="210" y2="180" stroke="#fff" stroke-width="2" marker-end="url(#arw)"/>
          <rect x="212" y="130" width="130" height="100" rx="14" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
          <text x="277" y="170" fill="#fff" font-size="18" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">Internet</text>
          <text x="277" y="196" fill="#fff" font-size="18" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">gateway</text>

          <line x1="344" y1="180" x2="378" y2="180" stroke="#fff" stroke-width="2" marker-end="url(#arw)"/>
          <rect x="380" y="40" width="320" height="260" rx="18" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="8 6"/>
          <text x="400" y="72" fill="#fff" font-size="16" font-weight="600" font-family="Geist, sans-serif">Your VPC</text>

          <rect x="400" y="90" width="135" height="200" rx="12" fill="#111114" stroke="#fff"/>
          <text x="467" y="120" fill="#fff" font-size="16" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">Subnet A</text>
          <rect x="420" y="140" width="95" height="60" rx="10" fill="#fff"/>
          <text x="467" y="177" fill="#000" font-size="16" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">Server A</text>
          <text x="467" y="250" fill="#fff" font-size="14" text-anchor="middle" font-family="Geist, sans-serif">web and admin</text>

          <rect x="545" y="90" width="135" height="200" rx="12" fill="#111114" stroke="#fff"/>
          <text x="612" y="120" fill="#fff" font-size="16" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">Subnet B</text>
          <rect x="565" y="140" width="95" height="60" rx="10" fill="#fff"/>
          <text x="612" y="177" fill="#000" font-size="16" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">Server B</text>
          <text x="612" y="250" fill="#fff" font-size="14" text-anchor="middle" font-family="Geist, sans-serif">web and admin</text>

          <line x1="90" y1="230" x2="90" y2="290" stroke="#fff" stroke-width="2" marker-end="url(#arw)"/>
          <rect x="20" y="292" width="300" height="88" rx="14" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
          <text x="170" y="326" fill="#fff" font-size="18" font-weight="600" text-anchor="middle" font-family="Geist, sans-serif">Website bucket (S3)</text>
          <text x="170" y="352" fill="#fff" font-size="15" text-anchor="middle" font-family="Geist, sans-serif">holds index.html and images</text>

          <circle cx="185" cy="160" r="14" fill="#fff"/>
          <text x="185" y="166" fill="#000" font-size="16" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">1</text>
          <circle cx="112" cy="260" r="14" fill="#fff"/>
          <text x="112" y="266" fill="#000" font-size="16" font-weight="700" text-anchor="middle" font-family="Geist, sans-serif">2</text>
        </svg>
